{% extends "base.html" %}

{% block title %}Add attachment - workflango demo{% endblock %}

{% block content %}
<h1>Add attachment to &ldquo;{{ request_obj.title }}&rdquo;</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ request_obj.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
